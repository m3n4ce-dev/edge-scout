# Fees in % per trade (one side). The whole question is whether an edge survives THESE, so keep them current.
# "verified" = checked against the venue's published schedule on the date given; anything else is a
# placeholder to confirm before trusting a result built on it.
tier: entry          # which tier the report treats as yours: entry | t10k (30-day volume $10K-$50K)
cash_yield_pct: 4.0  # what idle USD earns elsewhere (T-bills / money market) - update; a carry trade must beat it

spot:
